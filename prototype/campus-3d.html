<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성결 캠퍼스 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed playable 3D campus; HUD at the corners (campus status + today card top-left, tools top-right, joystick bottom-left, actions bottom-right). */
:root{
  --navy:#1D2C50; --navy-deep:#0F1830; --sky:#ADDEF8; --sun:#FFF096; --coral:#EF8465; --brick:#D9754B;
  --paper:#FFFDF7; --ink:#1D2C50; --muted:#465777;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#BFE6F6;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.sky-day{background:linear-gradient(180deg,#86CFF1 0%,#C4E9F8 55%,#E8F7FC 100%)}
.sky-night{background:linear-gradient(180deg,#0B1533 0%,#1C2B57 55%,#2C3F6E 100%);opacity:0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;outline:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.blabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 11px 6px;border:none;border-radius:14px;background:rgba(255,253,247,.95);box-shadow:0 2px 0 rgba(29,44,80,.18),0 6px 16px rgba(29,44,80,.12);font-family:var(--body);color:var(--ink);cursor:pointer;white-space:nowrap;transition:opacity .25s}
.blabel b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.1}
.blabel small{font-size:10.5px;color:var(--muted)}
.blabel .st{margin-top:2px;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:700}
.st.done{background:#DDF3E2;color:#1F6B3A}.st.build{background:#FFE7C2;color:#8A4B0C}.st.plan{background:#EEF1F5;color:#465777}.st.tent{background:#E3F2FB;color:#1D2C50}
.blabel::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,253,247,.95)}
.blabel.small{padding:3px 8px 4px}.blabel.small b{font-size:12.5px}
.bubble{position:absolute;left:0;top:0;max-width:220px;padding:6px 11px;border-radius:14px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:500;line-height:1.35;text-align:center;box-shadow:0 2px 0 rgba(29,44,80,.15);opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}.bubble.talk{background:#FFF8D6;font-weight:700}
.metag{position:absolute;left:0;top:0;padding:2px 9px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}

.hud{position:fixed;z-index:3;pointer-events:none}
.hud > *{pointer-events:auto}
.top-left{left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 32px - 168px))}
.top-right{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px}
.card{border-radius:20px;background:rgba(255,253,247,.94);box-shadow:0 3px 0 rgba(29,44,80,.16)}
.title{display:flex;flex-direction:column;gap:6px;padding:9px 14px 11px}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.05}
.title p{margin:0;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.bar{width:100%;height:8px;border-radius:4px;background:#E3EDF6;overflow:hidden}
.bar div{height:100%;border-radius:4px;background:var(--navy);transition:width .6s}
.today{padding:0;overflow:hidden}
.today-toggle{width:100%;min-height:44px;padding:8px 12px;border:none;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--body);color:var(--ink);cursor:pointer;text-align:left;font-size:13px}
.today-toggle b{font-weight:700}
.chev{transition:transform .2s;flex-shrink:0}
.today[data-open="true"] .chev{transform:rotate(180deg)}
.today ul{list-style:none;margin:0;padding:0 12px 10px;display:flex;flex-direction:column;gap:6px}
.today li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.today li .k{min-width:42px;padding:2px 0;border-radius:7px;background:#EEF3F9;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.icon-btn{width:48px;height:48px;border:none;border-radius:24px;background:rgba(255,253,247,.95);color:var(--ink);box-shadow:0 3px 0 rgba(29,44,80,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.icon-btn:active,.act:active,.round:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.bottom-left{left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.joy{width:128px;height:128px;border-radius:50%;background:rgba(255,253,247,.45);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(29,44,80,.15);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(29,44,80,.2)}
.keys{padding:10px 14px;font-size:12px;line-height:1.6}
.keys kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:6px;background:#EEF3F9;border-bottom:2px solid #CBD5E1;font-family:var(--body);font-size:11px;text-align:center}
.bottom-right{right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.act{min-height:50px;padding:0 18px;border:none;border-radius:25px;background:var(--coral);color:#fff;font-family:var(--body);font-weight:700;font-size:14px;box-shadow:0 4px 0 #B8542F;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.act kbd{padding:0 6px;border-radius:6px;background:rgba(255,255,255,.3);font-family:var(--body);font-size:11px}
.round-row{display:flex;align-items:flex-end;gap:12px}
.round{border:none;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--display);box-shadow:0 4px 0 var(--navy-deep);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.round.big{width:76px;height:76px;font-size:15px}
.round.small{width:58px;height:58px;font-size:13px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,44,80,.25)}
.sheet{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:16px;border-radius:24px;background:var(--paper);box-shadow:0 4px 0 rgba(29,44,80,.18),0 18px 40px rgba(15,24,48,.25);display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:#FFF6E4}
.prog .row{display:flex;justify-content:space-between;font-size:12.5px;font-variant-numeric:tabular-nums}
.prog .bar div{background:var(--brick)}
.sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sheet li{padding:9px 12px;border-radius:14px;background:#F2F6FA;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.sheet li span:last-child{color:var(--muted);font-size:11.5px;white-space:nowrap}
.sheet li.btnrow{padding:0;background:transparent}
.rowbtn{width:100%;min-height:44px;padding:9px 12px;border:none;border-radius:14px;background:#F2F6FA;font-family:var(--body);font-size:13px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-align:left}
.rowbtn:hover{background:#E6EEF7}.rowbtn span:last-child{color:var(--muted);font-size:11.5px;white-space:nowrap}
.game{display:flex;flex-direction:column;align-items:center;gap:6px}
.game .stage{position:relative;width:260px;height:220px;border-radius:14px;background:#EAF4FB;overflow:hidden}
.game p{margin:0;font-size:13px;font-weight:700}
.blk{position:absolute;height:18px;border-radius:4px;background:#D9754B;border:2px solid #fff;box-sizing:border-box}
.panel{position:fixed;z-index:4;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 160px - env(safe-area-inset-top,0px));overflow:auto;box-sizing:border-box;padding:16px;border-radius:24px;background:var(--paper);box-shadow:0 4px 0 rgba(29,44,80,.18),0 18px 40px rgba(15,24,48,.25);display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
#panelBody{display:flex;flex-direction:column;gap:12px}
.tt{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));grid-template-rows:26px repeat(9,36px);gap:2px;font-size:11px}
.tt .h{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);border-radius:8px}
.tt .h.today{color:var(--ink);background:#E3F2FB}
.tt .t{font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-variant-numeric:tabular-nums}
.tt .c{background:#F2F6FA;border-radius:6px}
.tt-blk{border:none;border-radius:10px;padding:4px 5px;text-align:left;font-family:var(--body);font-size:11px;font-weight:700;color:#1D2C50;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;z-index:1;line-height:1.25}
.tt-blk small{font-weight:500;font-size:10px;color:#33496E}
.tt-blk.next{outline:3px solid var(--coral);outline-offset:-2px}
.note{margin:0;font-size:12px;color:var(--muted)}
.rv-sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:#F2F6FA}
.rv-big{display:flex;flex-direction:column;align-items:center}
.rv-big b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1}
.rv-big span{font-size:11px;color:var(--muted)}
.rv-bars{display:flex;flex-direction:column;gap:6px;font-size:12px}
.rv-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;white-space:nowrap;gap:8px;align-items:center}
.rv-bar i{display:block;height:7px;border-radius:4px;background:#DCE5EF;overflow:hidden}
.rv-bar i b{display:block;height:100%;background:var(--navy)}
.rv-bar em{font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap}
.rv-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rv-card{padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #E3EAF2;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.45}
.rv-card .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.rv-card .who{display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{min-height:40px;padding:0 14px;border-radius:20px;border:2px solid #D5DCE6;background:#fff;font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.stars{display:flex;gap:2px}
.star{width:44px;height:44px;border:none;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field .lb,.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field textarea{min-height:76px;border-radius:14px;border:2px solid #D5DCE6;padding:10px 12px;font-family:var(--body);font-size:14px;color:var(--ink);resize:vertical;background:#fff}
.field textarea:focus{outline:3px solid var(--sky);border-color:var(--navy)}
.err{margin:0;font-size:12px;color:#B3261E;min-height:16px}
.btn2{min-height:46px;border:none;border-radius:23px;background:#EEF3F9;color:var(--ink);font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer}
.go{min-height:48px;border:none;border-radius:24px;background:var(--navy);color:#fff;font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer}
.go.brick{background:var(--brick);box-shadow:0 4px 0 #A9502C}
.close{width:44px;height:44px;border:none;border-radius:22px;background:#EEF3F9;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-160%);padding:10px 16px;border-radius:16px;background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 20px rgba(15,24,48,.3);transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
#fallback{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:#BFE6F6;text-align:center;font-size:15px}
@media (max-width:600px){
  .top-left{width:calc(100% - 32px - 60px)}
  .title h1{font-size:20px}
  .top-right{flex-direction:column}
  .icon-btn{width:46px;height:46px}
}
@media (prefers-reduced-motion:reduce){.toast,.bar div,.chev{transition:none}}
</style>
</head>
<body style="margin:0">

<div class="sky sky-day" aria-hidden="true"></div>
<div class="sky sky-night" id="skyNight" aria-hidden="true"></div>
<canvas id="scene" tabindex="0" aria-label="성결 캠퍼스 3D 화면. 캐릭터를 움직여 캠퍼스를 돌아다니고 건물을 지을 수 있어요."></canvas>
<div id="labels"></div>

<div class="hud top-left">
  <div class="card title">
    <h1>성결 캠퍼스</h1>
    <p><span>완성도 <b id="campusPct">0%</b></span><span>코인 <b id="coinText">120</b></span></p>
    <div class="bar" aria-hidden="true"><div id="campusBar" style="width:0%"></div></div>
  </div>
  <section class="card today" id="today" data-open="false" aria-label="오늘">
    <button type="button" class="today-toggle" id="todayToggle" aria-expanded="false" aria-controls="todayList">
      <span id="todaySummary">다음 수업</span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <ul id="todayList" hidden>
      <li><span class="k">수업</span><span id="todayClassText"></span></li>
      <li><span class="k">셔틀</span>16:40 학교 → 명학역 · 다음 17:00</li>
      <li><span class="k">학식</span>The bab 제육덮밥 · 중생관 옆 학생식당</li>
      <li><span class="k">D-3</span>교내 1차 장학금 신청 마감 11.27</li>
      <li><button type="button" class="btn2" id="todayTTBtn" style="width:100%">내 시간표 전체 보기</button></li>
    </ul>
  </section>
</div>

<div class="hud top-right">
  <button type="button" class="icon-btn" id="attendBtn" aria-label="출석하고 벽돌 2개 받기">
    <svg width="24" height="18" viewBox="0 0 22 16" aria-hidden="true"><rect x="1" y="1" width="20" height="14" rx="3" fill="#D9754B" stroke="#1D2C50" stroke-width="1.6"></rect><path d="M1 8h20M11 1v7M6 8v7M16 8v7" stroke="#fff" stroke-width="1.4"></path></svg>
    <span class="dot" id="attendDot"></span>
  </button>
  <button type="button" class="icon-btn" id="ttBtn" aria-label="내 시간표 열기">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3" fill="#E3F2FB"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M13.5 13.5h3M7.5 17h3"></path></svg>
  </button>
  <button type="button" class="icon-btn" id="nightBtn" aria-label="밤으로 바꾸기" aria-pressed="false">
    <svg id="sunIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="#FFF096"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
    <svg id="moonIcon" hidden width="24" height="24" viewBox="0 0 24 24" fill="#FFF096" stroke="#1D2C50" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
  </button>
  <button type="button" class="icon-btn" id="menuBtn" aria-label="메뉴 열기">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
  </button>
</div>

<div class="hud bottom-left">
  <div class="joy" id="joy" hidden aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
  <div class="card keys" id="keys" hidden><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Space</kbd> 점프 · <kbd>E</kbd> 상호작용<br>땅을 클릭해도 걸어가요 · 드래그로 시점 회전</div>
</div>

<div class="hud bottom-right">
  <button type="button" class="act" id="actBtn" hidden><span id="actText"></span><kbd id="actKey">E</kbd></button>
  <div class="round-row">
    <button type="button" class="round small" id="waveBtn" aria-label="인사하기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#EF8465" aria-hidden="true"><path d="M12 21s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 8.2a4.3 4.3 0 0 1 7.5 2.6C19.5 16.4 12 21 12 21z"></path></svg>인사
    </button>
    <button type="button" class="round big" id="jumpBtn" aria-label="점프">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFF096" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"></path></svg>점프
    </button>
  </div>
</div>

<section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <div><h2 id="sheetTitle"></h2><p id="sheetSub"></p></div>
    <button type="button" class="close" id="sheetClose" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
  <div class="prog" id="sheetProg" hidden>
    <div class="row"><span>벽돌</span><span id="progBricks"></span></div>
    <div class="bar" aria-hidden="true"><div id="progBar"></div></div>
    <div class="row"><span>건축 참여</span><span id="progBuilders"></span></div>
  </div>
  <div class="game" id="game" hidden><div class="stage" id="stackArea" aria-label="벽돌 쌓기 게임 화면"></div><p id="gameMsg" aria-live="polite"></p></div>
  <ul id="sheetList"></ul>
  <button type="button" class="go" id="sheetGo"></button>
</section>
