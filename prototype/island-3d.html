<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성결 섬 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed playable 3D island; HUD floats at the corners (status top-left, tools top-right, joystick bottom-left, actions bottom-right). */
:root{
  --navy:#1D2C50; --navy-deep:#0F1830; --sky:#ADDEF8; --sun:#FFF096; --coral:#EF8465; --coral-ink:#A63E1F;
  --paper:#FFFDF7; --ink:#1D2C50; --muted:#465777;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#BFE6F6;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.sky-day{background:linear-gradient(180deg,#86CFF1 0%,#C4E9F8 55%,#E8F7FC 100%)}
.sky-night{background:linear-gradient(180deg,#0B1533 0%,#1C2B57 55%,#2C3F6E 100%);opacity:0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;outline:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.blabel{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 11px 6px;border:none;border-radius:14px;background:rgba(255,253,247,.95);box-shadow:0 2px 0 rgba(29,44,80,.18),0 6px 16px rgba(29,44,80,.12);font-family:var(--body);color:var(--ink);cursor:pointer;white-space:nowrap;transition:opacity .25s}
.blabel b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.1}
.blabel small{font-size:10.5px;color:var(--muted)}
.blabel::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,253,247,.95)}
.blabel:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.bubble{position:absolute;left:0;top:0;max-width:220px;padding:6px 11px;border-radius:14px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:500;line-height:1.35;white-space:normal;text-align:center;box-shadow:0 2px 0 rgba(29,44,80,.15);opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}
.bubble.talk{background:#FFF8D6;font-weight:700}
.metag{position:absolute;left:0;top:0;padding:2px 9px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}

.hud{position:fixed;z-index:3;pointer-events:none}
.hud > *{pointer-events:auto}
.top-left{left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 32px - 160px))}
.top-right{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px}
.card{border-radius:20px;background:rgba(255,253,247,.94);box-shadow:0 3px 0 rgba(29,44,80,.16)}
.title{display:flex;flex-direction:column;padding:7px 14px 8px;align-self:flex-start}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.05}
.title p{margin:0;font-size:11.5px;color:var(--muted)}
.status{padding:0;overflow:hidden}
.status-toggle{width:100%;min-height:46px;padding:8px 12px;border:none;background:transparent;display:flex;flex-direction:column;gap:6px;font-family:var(--body);color:var(--ink);cursor:pointer;text-align:left}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.status-row strong{font-size:13.5px}
.chev{transition:transform .2s}
.status[data-open="true"] .chev{transform:rotate(180deg)}
.bar{width:100%;height:9px;border-radius:5px;background:#E3EDF6;overflow:hidden}
.bar div{height:100%;border-radius:5px;background:var(--navy);transition:width .5s}
.status-more{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.status-more p{margin:0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.status-more p span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.stage{min-height:38px;border-radius:12px;border:none;background:#EEF3F9;color:var(--ink);font-family:var(--display);font-size:15px;cursor:pointer}
.stage[aria-pressed="true"]{background:var(--navy);color:#fff}
.icon-btn{width:48px;height:48px;border:none;border-radius:24px;background:rgba(255,253,247,.95);color:var(--ink);box-shadow:0 3px 0 rgba(29,44,80,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.icon-btn:active,.act:active,.round:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

.bottom-left{left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.joy{width:128px;height:128px;border-radius:50%;background:rgba(255,253,247,.45);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(29,44,80,.15);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(29,44,80,.2);display:flex;align-items:center;justify-content:center}
.keys{padding:10px 14px;font-size:12px;color:var(--ink);line-height:1.6}
.keys kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:6px;background:#EEF3F9;border-bottom:2px solid #CBD5E1;font-family:var(--body);font-size:11px;text-align:center}
.bottom-right{right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.act{min-height:50px;padding:0 18px;border:none;border-radius:25px;background:var(--coral);color:#fff;font-family:var(--body);font-weight:700;font-size:14px;box-shadow:0 4px 0 #B8542F;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.act kbd{padding:0 6px;border-radius:6px;background:rgba(255,255,255,.3);font-family:var(--body);font-size:11px}
.round-row{display:flex;align-items:flex-end;gap:12px}
.round{border:none;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--display);box-shadow:0 4px 0 var(--navy-deep);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.round.big{width:76px;height:76px;font-size:15px}
.round.small{width:58px;height:58px;font-size:13px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(29,44,80,.25)}

.sheet{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:16px;border-radius:24px;background:var(--paper);box-shadow:0 4px 0 rgba(29,44,80,.18),0 18px 40px rgba(15,24,48,.25);display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sheet li{padding:10px 12px;border-radius:14px;background:#F2F6FA;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.sheet li span:last-child{color:var(--muted);font-size:11px;white-space:nowrap}
.go{min-height:48px;border:none;border-radius:24px;background:var(--navy);color:#fff;font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer}
.close{width:44px;height:44px;border:none;border-radius:22px;background:#EEF3F9;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-160%);padding:10px 16px;border-radius:16px;background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 20px rgba(15,24,48,.3);transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
#fallback{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:#BFE6F6;text-align:center;font-size:15px}
@media (max-width:600px){
  .top-left{width:calc(100% - 32px - 112px)}
  .title h1{font-size:22px}
  .top-right{flex-direction:column}
  .icon-btn{width:46px;height:46px}
}
@media (prefers-reduced-motion:reduce){.toast,.bar div,.chev{transition:none}}
</style>
</head>
<body style="margin:0">

<div class="sky sky-day" aria-hidden="true"></div>
<div class="sky sky-night" id="skyNight" aria-hidden="true"></div>
<canvas id="scene" tabindex="0" aria-label="성결 섬 3D 화면. 캐릭터를 움직여 섬을 돌아다닐 수 있어요."></canvas>
<div id="labels"></div>

<div class="hud top-left">
  <div class="card title"><h1>성결 섬</h1><p>경기 안양 · 시즌 1</p></div>
  <section class="card status" id="status" data-open="false" aria-label="재림관 랜드마크 상태">
    <button type="button" class="status-toggle" id="statusToggle" aria-expanded="false" aria-controls="statusMore">
      <span class="status-row"><strong id="stageTitle">재림관 4단계 · 깃발</strong>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      <span class="bar" aria-hidden="true"><div id="barFill" style="width:62%"></div></span>
    </button>
    <div class="status-more" id="statusMore" hidden>
      <p><span id="stageDesc"></span><span id="brickText">벽돌 3,120 / 5,000 (예시)</span></p>
      <div class="stages" role="group" aria-label="랜드마크 단계 미리보기" id="stages"></div>
    </div>
  </section>
</div>

<div class="hud top-right">
  <button type="button" class="icon-btn" id="attendBtn" aria-label="출석하고 벽돌 1개 받기">
    <svg width="24" height="18" viewBox="0 0 22 16" aria-hidden="true"><rect x="1" y="1" width="20" height="14" rx="3" fill="#EF8465" stroke="#1D2C50" stroke-width="1.6"></rect><path d="M1 8h20M11 1v7M6 8v7M16 8v7" stroke="#fff" stroke-width="1.4"></path></svg>
    <span class="dot" id="attendDot"></span>
  </button>
  <button type="button" class="icon-btn" id="nightBtn" aria-label="밤으로 바꾸기" aria-pressed="false">
    <svg id="sunIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="#FFF096"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
    <svg id="moonIcon" hidden width="24" height="24" viewBox="0 0 24 24" fill="#FFF096" stroke="#1D2C50" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
  </button>
  <button type="button" class="icon-btn" id="menuBtn" aria-label="메뉴 열기">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
  </button>
</div>

<div class="hud bottom-left">
  <div class="joy" id="joy" hidden aria-label="이동 조이스틱"><div class="knob" id="knob"><svg width="20" height="20" viewBox="0 0 24 24" fill="#ADDEF8" stroke="#1D2C50" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle></svg></div></div>
  <div class="card keys" id="keys" hidden><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Space</kbd> 점프 · <kbd>E</kbd> 상호작용<br>땅을 클릭해도 걸어가요 · 드래그로 시점 회전</div>
</div>

<div class="hud bottom-right">
  <button type="button" class="act" id="actBtn" hidden><span id="actText"></span><kbd id="actKey">E</kbd></button>
  <div class="round-row">
    <button type="button" class="round small" id="waveBtn" aria-label="인사하기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#EF8465" aria-hidden="true"><path d="M12 21s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 8.2a4.3 4.3 0 0 1 7.5 2.6C19.5 16.4 12 21 12 21z"></path></svg>인사
    </button>
    <button type="button" class="round big" id="jumpBtn" aria-label="점프">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFF096" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"></path></svg>점프
    </button>
  </div>
</div>

<section class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <div><h2 id="sheetTitle"></h2><p id="sheetSub"></p></div>
    <button type="button" class="close" id="sheetClose" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2C50" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
  <ul id="sheetList"></ul>
  <button type="button" class="go" id="sheetGo"></button>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="fallback" hidden>이 기기에서는 3D 화면을 표시할 수 없어요. WebGL을 지원하는 브라우저에서 열어 주세요.</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
$(coarse ? 'joy' : 'keys').hidden = false;
$('actKey').hidden = coarse;

/* ============ renderer ============ */
const canvas = $('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { $('fallback').hidden = false; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const FOG_DAY = new THREE.Color('#D3EEF8'), FOG_NIGHT = new THREE.Color('#2A3B66');
scene.fog = new THREE.Fog(FOG_DAY.clone(), 50, 150);
const camera = new THREE.PerspectiveCamera(36, 1, 0.3, 600);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.enablePan = false;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.8;
controls.minPolarAngle = 0.45;
controls.maxPolarAngle = 1.22;
controls.minDistance = 9;
controls.maxDistance = 48;

/* ============ helpers ============ */
let seed = 1102;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + rand() * (b - a);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const matCache = new Map();
function mat(color, extra) {
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.82, metalness: 0 }, extra || {}));
  matCache.set(key, m);
  return m;
}
function add(parent, geo, material, x = 0, y = 0, z = 0, opts = {}) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  parent.add(m);
  return m;
}
const rbox = (w, h, d, r = 0.15, s = 4) => new RoundedBoxGeometry(w, h, d, s, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
const geoCache = new Map();
const sphere = (r, ws = 24, hs = 18) => { const k = `s${r}_${ws}_${hs}`; if (!geoCache.has(k)) geoCache.set(k, new THREE.SphereGeometry(r, ws, hs)); return geoCache.get(k); };
function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
}
function blobs(g, s, n, colors, rmin, rmax, alpha) {
  for (let i = 0; i < n; i++) {
    const x = rand() * s, y = rand() * s, r = rr(rmin, rmax);
    g.fillStyle = pick(colors);
    g.globalAlpha = alpha;
    for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, Math.PI * 2); g.fill(); }
  }
  g.globalAlpha = 1;
}

/* ============ textures ============ */
const grassTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#8FD06A'; g.fillRect(0, 0, s, s);
  blobs(g, s, 70, ['#9EDB78', '#A7DF80', '#82C460'], 20, 70, 0.35);
  g.strokeStyle = '#6FB257'; g.lineWidth = 2; g.lineCap = 'round';
  for (let i = 0; i < 700; i++) { const x = rand() * s, y = rand() * s; g.globalAlpha = 0.45; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2, 2), y - rr(4, 8)); g.stroke(); }
  g.globalAlpha = 1;
}, [1 / 9, 1 / 9]);
const sandTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#F4DEA8'; g.fillRect(0, 0, s, s);
  blobs(g, s, 40, ['#F8E6B9', '#EED39A'], 10, 30, 0.4);
  for (let i = 0; i < 500; i++) { g.fillStyle = pick(['#E3C686', '#FFF3D2']); g.globalAlpha = 0.6; g.fillRect(rand() * s, rand() * s, 2, 2); }
  g.globalAlpha = 1;
}, [1 / 6, 1 / 6]);
const cliffTex = canvasTex(256, (g, s) => {
  const bands = ['#CF9C64', '#C38F58', '#D7A86F', '#BE8752'];
  let y = 0, i = 0;
  while (y < s) { const h = rr(18, 40); g.fillStyle = bands[i++ % bands.length]; g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= s; x += 16) g.lineTo(x, y + Math.sin(x * 0.05 + i) * 4); g.lineTo(s, y + h + 6); g.lineTo(0, y + h + 6); g.fill(); y += h; }
  for (let k = 0; k < 40; k++) { g.fillStyle = 'rgba(255,240,210,0.35)'; g.beginPath(); g.ellipse(rand() * s, rand() * s, rr(4, 10), rr(2, 4), 0, 0, Math.PI * 2); g.fill(); }
}, [1 / 7, 0.55]);
const plazaTex = canvasTex(1024, (g, s) => {
  g.fillStyle = '#E4D2A6'; g.fillRect(0, 0, s, s);
  const c = s / 2;
  for (let ring = 0; ring < 9; ring++) {
    const r0 = 60 + ring * 52, r1 = r0 + 44;
    const n = Math.round((2 * Math.PI * (r0 + 22)) / 70);
    for (let k = 0; k < n; k++) {
      const a0 = (k / n) * Math.PI * 2 + ring * 0.3, a1 = ((k + 1) / n) * Math.PI * 2 + ring * 0.3 - 0.035;
      g.fillStyle = pick(['#F3E6C4', '#EFDEB6', '#F6EBCF']);
      g.beginPath(); g.arc(c, c, r1, a0, a1); g.arc(c, c, r0, a1, a0, true); g.closePath(); g.fill();
